<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day Finder</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 20%, #1b1f3b, #05060f 70%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color:#fff;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 44px 48px;
    text-align:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    min-width: 320px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 24px;
    color: #cfd3ff;
    letter-spacing: 1px;
  }
  .inputs {
    display:flex;
    gap: 10px;
    justify-content:center;
    margin-bottom: 20px;
  }
  input {
    width: 70px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: #fff;
    text-align:center;
    font-size: 1rem;
  }
  input#year { width: 90px; }
  input::placeholder { color: #8b8fa8; }
  button {
    padding: 10px 26px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg,#7fd8ff,#a78bfa);
    color: #0a0a1a;
    font-weight: 700;
    cursor: pointer;
    font-size: 1rem;
  }
  button:hover { opacity: 0.9; }
  .result {
    margin-top: 24px;
    font-size: 1.6rem;
    font-weight: 700;
    color: #7fd8ff;
    min-height: 2rem;
  }
  .error {
    color: #ff8080;
    font-size: 0.95rem;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Find the Day of the Week</h1>
    <div class="inputs">
      <input type="number" id="day" placeholder="DD" min="1" max="31">
      <input type="number" id="month" placeholder="MM" min="1" max="12">
      <input type="number" id="year" placeholder="YYYY" min="1" max="9999">
    </div>
    <button onclick="findDay()">Find Day</button>
    <div class="result" id="result"></div>
  </div>

<script>
function findDay() {
  const day = parseInt(document.getElementById('day').value);
  const month = parseInt(document.getElementById('month').value);
  const year = parseInt(document.getElementById('year').value);
  const resultEl = document.getElementById('result');

  if (!day || !month || !year || month < 1 || month > 12 || day < 1 || day > 31) {
    resultEl.innerHTML = '<span class="error">Please enter a valid date</span>';
    return;
  }

  const date = new Date(year, month - 1, day);

  // Validate the date actually exists (e.g. reject Feb 30)
  if (date.getMonth() !== month - 1 || date.getDate() !== day) {
    resultEl.innerHTML = '<span class="error">This date does not exist</span>';
    return;
  }

  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  resultEl.textContent = days[date.getDay()];
}
</script>
</body>
</html>
